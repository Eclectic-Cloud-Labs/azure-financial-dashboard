name: AKS Auto-Stop

on:
  schedule:
    # 06:00 UTC = 12am MDT (summer) / 11pm MST (winter)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Stop AKS cluster
        run: |
          STATE=$(az aks show -g rgFindashDev -n findash-aks-dev --query powerState.code -o tsv)
          echo "Current power state: $STATE"
          if [ "$STATE" = "Running" ]; then
            az aks stop -g rgFindashDev -n findash-aks-dev
            echo "Cluster stopped."
          else
            echo "Cluster already stopped, nothing to do."
          fi