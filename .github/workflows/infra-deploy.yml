name: Run Azure Login with OIDC for Deployment to Azure Workflow

on: 
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    # Retrieved from https://github.com/Azure/bicep-deploy
      - name: Deployment
        uses: azure/bicep-deploy@v2
        with:
            type: deployment
            operation: create
            name: Development
            location: eastus
            scope: subscription
            subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
            template-file: infra/main.bicep
            parameters-file: infra/main.dev.bicepparam

            